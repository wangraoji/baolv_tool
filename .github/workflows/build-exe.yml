name: Build EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name baolv_tool --add-data "baolv_tool/assets;assets" main.py

      - name: Verify output
        run: |
          ls -la dist/
          test -f dist/baolv_tool.exe && echo "EXE exists"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: baolv_tool-windows
          path: dist/baolv_tool.exe
          if-no-files-found: error
