name: Build EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller baolv_tool.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: baolv_tool-windows
          path: dist/baolv_tool.exe
