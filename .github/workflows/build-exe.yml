name: Build EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --upgrade pyinstaller

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $ver = python -c "from baolv_tool import __version__; print(__version__)"
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name baolv_tool --icon "baolv_tool/assets/icon.ico" --add-data "baolv_tool/assets;assets" main.py

      - name: Rename EXE
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          $exeName = "爆率查询一键生成 V$ver.exe"
          Copy-Item "dist/baolv_tool.exe" "$exeName"
          Get-ChildItem *.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 爆率查询一键生成 V${{ steps.version.outputs.VERSION }}
          path: 爆率查询一键生成 V${{ steps.version.outputs.VERSION }}.exe
          if-no-files-found: error
